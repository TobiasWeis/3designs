esphome:
  name: esphome-web-da236f
  friendly_name: ESPHome Web da236f
  min_version: 2025.9.0
  name_add_mac_suffix: false

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-Pwm-Fan-Control"
    password: "ofE9isZx6aai"

captive_portal:
    
output:
  - platform: esp8266_pwm
    pin: GPIO2  # this is D4
    frequency: 25000 Hz
    id: pwm_output

fan:
  - platform: speed
    output: pwm_output
    name: "Fan Control"
    restore_mode: RESTORE_DEFAULT_ON
